name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PYTHONIOENCODING: utf-8
  KAFKA_MOCK_MODE: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black pylint

      - name: Check formatting with black
        run: black --check --diff src/ main.py streamlit_app.py run_streaming.py

      - name: Lint with pylint
        run: |
          pylint --fail-under=7 src/ --ignore=__init__.py || true
          pylint --fail-under=7 main.py || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Pipeline smoke test
        run: |
          python -c "
          from src.transformation.pipeline import DataPipeline
          from src.forecasting.prophet_model import FinancialForecaster
          from src.forecasting.mlp_model import MLPFinancialForecaster
          from src.forecasting.comparison import ModelComparison
          from src.anomaly_detection.detector import AnomalyDetector
          from src.visualization.charts import ExecutiveCharts
          pipeline = DataPipeline('data/raw/KEEDIO_Cierre_Mensual.csv')
          df = pipeline.run()
          monthly = pipeline.get_monthly_aggregate()
          assert len(df) == 128
          assert len(monthly) == 16
          print(f'SMOKE OK: {len(df)} records, {len(monthly)} months')
          "
